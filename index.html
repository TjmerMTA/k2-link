<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перенаправлення…</title>
<link rel="canonical" href="https://tjmermta.github.io/k2-link/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#253372;color:#fff;font:300 15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       text-align:center;padding:24px}
  .box{max-width:420px}
  a{color:#fff;text-decoration:none;border-bottom:2px solid #e60004;word-break:break-all}
  .muted{opacity:.6;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <p id="msg">Відкриваємо…</p>
  <p class="muted" id="hint"></p>
</div>
<script>
  // Адреса тимчасового тунелю змінюється при кожному запуску, тому лежить
  // окремим файлом: сама сторінка лишається за постійною адресою.
  fetch('target.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.url) throw new Error('порожньо');
      var шлях = location.hash ? location.hash.slice(1) : '';
      location.replace(d.url + (шлях ? '/' + шлях.replace(/^\/+/, '') : '/'));
    })
    .catch(function () {
      document.getElementById('msg').textContent = 'Сервіс зараз недоступний.';
      document.getElementById('hint').textContent =
        'Систему вимкнено або тунель не піднято. Спробуйте пізніше.';
    });
</script>
</body>
</html>
