<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перенаправлення…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#253372;color:#fff;font:300 15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       text-align:center;padding:24px}
  .box{max-width:460px}
  h1{font-size:17px;font-weight:600;margin:0 0 10px}
  .muted{opacity:.65;font-size:13px;margin-top:14px}
  button{margin-top:18px;padding:11px 22px;border:0;background:#e60004;color:#fff;
         font:600 12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  button:hover{background:#b80003}
</style>
</head>
<body>
<div class="box">
  <h1 id="msg">Відкриваємо…</h1>
  <p class="muted" id="hint"></p>
  <button id="retry" hidden onclick="location.reload()">Спробувати ще раз</button>
</div>
<script>
  // Адреса тунелю змінюється при кожному його запуску, тому лежить окремим
  // файлом. Спершу читаємо його з raw.githubusercontent — там свіже одразу
  // після пушу; сторінка на Pages може ще перебудовуватись хвилину.
  var ДЖЕРЕЛА = [
    'https://raw.githubusercontent.com/TjmerMTA/k2-link/main/target.json',
    'target.json'
  ];

  function показатиПомилку(текст) {
    document.getElementById('msg').textContent = 'Система зараз недоступна';
    document.getElementById('hint').textContent = текст;
    document.getElementById('retry').hidden = false;
  }

  function спробувати(i) {
    if (i >= ДЖЕРЕЛА.length) {
      показатиПомилку('Не вдалося дізнатися адресу. Робочу машину, найімовірніше, вимкнено.');
      return;
    }
    fetch(ДЖЕРЕЛА[i] + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        if (!d || !d.url) return Promise.reject();
        var шлях = location.hash ? location.hash.slice(1).replace(/^\/+/, '') : '';
        location.replace(d.url + '/' + шлях);
      })
      .catch(function () { спробувати(i + 1); });
  }

  спробувати(0);
</script>
</body>
</html>
